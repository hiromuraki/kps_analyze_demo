<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule Builder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { height:100vh; display:flex; flex-direction:column; background:#0f172a; color:#e2e8f0; font-family:'PingFang SC','Microsoft YaHei',monospace; overflow:hidden; }

  header { padding:8px 16px; background:#1e293b; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; gap:12px; }
  header h1 { font-size:14px; white-space:nowrap; }
  .header-right { display:flex; gap:8px; align-items:center; }
  .header-right input { background:#0f172a; border:1px solid #475569; color:#e2e8f0; border-radius:6px; padding:5px 10px; font-size:12px; width:150px; }
  .header-right button { padding:6px 16px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; white-space:nowrap; }
  .header-right button:hover { background:#1d4ed8; }

  .main { display:flex; flex:1; min-height:0; }
  .left { flex:1; display:flex; flex-direction:column; min-width:0; background:#000; }
  #view-area { flex:1; display:flex; min-height:0; }
  #view-area.horizontal { flex-direction:row; }
  #view-area.vertical { flex-direction:column; }

  #video-box { display:flex; align-items:center; justify-content:center; background:#0a0a0a; min-height:40px; min-width:40px; position:relative; overflow:hidden; }
  #video-box video { max-width:100%; max-height:100%; object-fit:contain; }
  #video-box canvas { position:absolute; max-width:100%; max-height:100%; pointer-events:none; z-index:2; }
  #drop-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:13px; pointer-events:none; z-index:0; flex-direction:column; gap:6px; }
  #drop-hint .icon { font-size:32px; }
  #no2d-hint { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:3; background:rgba(0,0,0,0.6); color:#94a3b8; padding:3px 10px; border-radius:4px; font-size:10px; display:none; pointer-events:none; }
  #angle-float { position:absolute; top:6px; right:6px; z-index:10; background:rgba(30,41,59,0.9); backdrop-filter:blur(8px); padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); font-size:11px; min-width:140px; display:none; }
  #angle-float h4 { font-size:10px; color:#94a3b8; margin-bottom:4px; }
  .angle-entry { display:flex; align-items:center; gap:5px; padding:1px 0; font-size:11px; }
  .angle-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  #grip { flex:0 0 4px; background:#1e293b; cursor:col-resize; }
  #grip:hover { background:#334155; }
  #view-area.vertical #grip { cursor:row-resize; }
  #three-box { background:#0a0a14; position:relative; min-height:80px; min-width:60px; display:none; }
  #three-box.show { display:block; }
  #canvas-container { width:100%; height:100%; }

  #upload-bar { display:flex; gap:6px; padding:5px 10px; background:#1e293b; flex-shrink:0; align-items:center; flex-wrap:wrap; }
  #upload-bar .label { font-size:11px; color:#64748b; margin-right:2px; }
  .up-btn { display:inline-flex; align-items:center; gap:5px; padding:4px 14px; background:#2a3343; border:1px solid #475569; border-radius:5px; cursor:pointer; font-size:12px; transition:.2s; white-space:nowrap; color:#c8d0dc; flex-shrink:0; }
  .up-btn:hover { border-color:#2563eb; background:#2f3a4c; }
  .up-btn.done { background:#065f46; border-color:#059669; color:#b8f0d0; }
  .up-btn input { display:none; }

  #ctrl-bar { padding:5px 10px; background:#1e293b; display:flex; align-items:center; gap:5px; flex-shrink:0; flex-wrap:wrap; }
  #ctrl-bar button { padding:4px 10px; background:#334155; color:#e2e8f0; border:none; border-radius:4px; cursor:pointer; font-size:11px; font-weight:bold; }
  #ctrl-bar button:hover { background:#475569; }
  #ctrl-bar button:disabled { opacity:0.3; cursor:default; }
  #frame-input { width:40px; text-align:center; background:#0f172a; border:1px solid #475569; color:#e2e8f0; border-radius:4px; padding:3px; font-size:11px; }
  input[type=range] { accent-color:#2563eb; flex:1; min-width:80px; height:4px; margin:0; }

  .right { width:280px; background:#1e293b; border-left:1px solid #334155; display:flex; flex-direction:column; overflow-y:auto; flex-shrink:0; }
  .right::-webkit-scrollbar { width:4px; }
  .right::-webkit-scrollbar-thumb { background:#475569; border-radius:2px; }
  .section { padding:10px 14px; border-bottom:1px solid #334155; }
  .section h3 { font-size:11px; color:#94a3b8; margin-bottom:8px; letter-spacing:1px; }

  #joint-svg { display:block; width:100%; }
  #joint-svg .bone-line { stroke-width:3; stroke-linecap:round; cursor:pointer; transition:stroke-width .15s; }
  #joint-svg .bone-line.selected { stroke-width:5; filter:drop-shadow(0 0 4px currentColor); }
  #joint-svg .bone-hit { stroke:transparent; stroke-width:14; stroke-linecap:round; cursor:pointer; }
  #joint-svg .joint-circle { cursor:default; }

  .rule-entry { background:#0f172a; border:1px solid #334155; border-radius:6px; padding:8px 10px; margin-bottom:6px; font-size:11px; }
  .rule-entry .r-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .rule-entry .r-header .r-id { font-weight:bold; color:#60a5fa; font-size:10px; }
  .rule-entry .r-header button { background:none; border:none; color:#f87171; cursor:pointer; font-size:12px; }
  .rule-entry .r-row { display:flex; gap:6px; margin-top:3px; align-items:center; }
  .rule-entry .r-row label { color:#94a3b8; font-size:10px; white-space:nowrap; }
  .rule-entry .r-row input, .rule-entry .r-row select { flex:1; background:#1e293b; border:1px solid #475569; color:#e2e8f0; border-radius:3px; padding:2px 5px; font-size:10px; }

  .btn-row { display:flex; gap:6px; }
  .btn-row button { flex:1; padding:7px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; font-size:11px; }
  .btn-capture { background:#0a4; color:#fff; }
  .btn-capture:hover { background:#0c6; }
  .btn-capture:disabled { opacity:0.3; cursor:default; }
</style>
</head>
<body>

<header>
  <h1>Rule Builder</h1>
  <div class="header-right">
    <input type="text" id="rule-name" placeholder="动作名称（如：哈克深蹲）">
    <button onclick="exportJSON()">📥 导出 JSON</button>
  </div>
</header>

<div class="main">
  <!-- Left: video + 3D (split-pane) + upload + controls -->
  <div class="left">
    <div id="upload-bar">
      <span class="label">数据来源</span>
      <label class="up-btn" id="btn-video"><span>🎬 选择视频文件</span><input type="file" id="file-video" accept="video/*"></label>
      <label class="up-btn" id="btn-2d"><span>📐 选择 2D 骨骼</span><input type="file" id="file-2d" accept=".npz"></label>
      <label class="up-btn" id="btn-3d"><span>🧊 选择 3D 骨骼</span><input type="file" id="file-3d" accept=".npz"></label>
    </div>

    <div id="view-area" class="vertical">
      <div id="video-box">
        <video id="video" preload="auto" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="drop-hint"><span class="icon">🎬</span>上传视频 + 骨骼数据以开始</div>
        <div id="no2d-hint">仅 3D 数据：骨骼预览在右侧</div>
        <div id="angle-float">
          <h4>📐 相邻夹角</h4>
          <div id="angle-list"></div>
        </div>
      </div>
      <div id="grip"></div>
      <div id="three-box"><div id="canvas-container"></div></div>
    </div>

    <div id="ctrl-bar">
      <button id="btn-prev" disabled>◀◀</button>
      <button id="btn-play"  disabled>▶</button>
      <button id="btn-next" disabled>▶▶</button>
      <input type="number" id="frame-input" value="0" min="0" disabled>
      <span style="font-size:11px;color:#94a3b8">/&nbsp;<b id="total-frames">0</b></span>
      <input type="range" id="progress" min="0" value="0" disabled style="flex:1">
    </div>
  </div>

  <!-- Right: bone selector + rules -->
  <div class="right">
    <div class="section">
      <h3>🦴 骨骼选择</h3>
      <svg id="joint-svg" viewBox="0 0 260 380" height="280"></svg>
    </div>
    <div class="section">
      <h3>📋 已录规则</h3>
      <div id="rule-list"><span style="color:#64748b;font-size:11px">选择骨骼 → 定位帧 → 点"录入"</span></div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn-capture" id="btn-capture" onclick="captureRule()" disabled>📸 保存当前规则</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ===================================================================
// Constants
// ===================================================================
const BONES=[[0,1],[1,2],[2,3],[0,4],[4,5],[5,6],[0,7],[7,8],[8,9],[9,10],[8,11],[11,12],[12,13],[8,14],[14,15],[15,16]];
const JN=["骨盆","右髋","右膝","右脚踝","左髋","左膝","左脚踝","脊柱","胸腔","鼻子","头顶","左肩","左肘","左手腕","右肩","右肘","右手腕"];
const JL=[{x:130,y:210},{x:148,y:235},{x:158,y:285},{x:163,y:340},{x:112,y:235},{x:102,y:285},{x:97,y:340},{x:130,y:178},{x:130,y:145},{x:130,y:112},{x:130,y:85},{x:100,y:158},{x:72,y:180},{x:48,y:200},{x:160,y:158},{x:188,y:180},{x:212,y:200}];
const DC='#3b82f6';
const PAL=['#f87171','#fb923c','#fbbf24','#a3e635','#34d399','#22d3ee','#8b5cf6','#f472b6','#e879f9','#f59e0b','#10b981','#ef4444','#6366f1','#ec4899','#14b8a6'];

// ===================================================================
// State
// ===================================================================
let d2=null,d3=null,cur=0,sel=new Map(),rules=[],pIdx=0;
let playing=false,pt=null,lastF=-1,anim=true;

function h2(){return d2!==null}
function h3(){return d3!==null}
function nf(){return h2()?d2.num_frames:(h3()?d3.num_frames:0)}
function u4(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);})}
function bk(a,b){return a<b?`${a}-${b}`:`${b}-${a}`}

// ===================================================================
// DOM
// ===================================================================
const vid=document.getElementById("video"),ov=document.getElementById("overlay"),ctx=ov.getContext("2d");
const af=document.getElementById("angle-float"),al=document.getElementById("angle-list");
const pg=document.getElementById("progress"),fi=document.getElementById("frame-input"),tf=document.getElementById("total-frames");
const dh=document.getElementById("drop-hint"),n2=document.getElementById("no2d-hint");
const tb=document.getElementById("three-box"),va=document.getElementById("view-area");
const vbox=document.getElementById("video-box"),grip=document.getElementById("grip");

// ===================================================================
// Upload
// ===================================================================
function upD(id,lbl){
  const b=document.getElementById(id);b.classList.add("done");
  const sp=b.querySelector("span");if(sp)sp.textContent="✓ "+lbl;
}

document.getElementById("file-video").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  vid.src=URL.createObjectURL(f);upD("btn-video",f.name); vid.load();
  vid.onloadedmetadata=()=>{ov.width=vid.videoWidth||640;ov.height=vid.videoHeight||480;vid.currentTime=0;layout3D();};
  vid.onplay=()=>{playing=true;document.getElementById("btn-play").textContent="⏸";};
  vid.onpause=()=>{playing=false;document.getElementById("btn-play").textContent="▶";};
};
document.getElementById("file-2d").onchange=async e=>{const f=e.target.files[0];if(!f)return;d2=await upN(f,"btn-2d");rdy();};
document.getElementById("file-3d").onchange=async e=>{const f=e.target.files[0];if(!f)return;d3=await upN(f,"btn-3d");rdy();};

async function upN(f,bid){
  const b=document.getElementById(bid),sp=b.querySelector("span");sp.textContent="⏳ 解析中...";
  const fd=new FormData();fd.append("file",f);
  try{
    const r=await fetch("/api/upload_npz",{method:"POST",body:fd}).then(r=>r.json());
    if(r.status!=="success"){sp.textContent="✕ 失败";return null;}
    const lbl=f.name.length>20?f.name.slice(0,18)+'…':f.name;upD(bid,lbl);
    return{frames:r.frames,num_frames:r.num_frames};
  }catch(e){sp.textContent="✕ 错误";return null;}
}

function rdy(){
  if(!h2()&&!h3())return;dh.style.display="none";initJP();
  ["btn-prev","btn-play","btn-next","btn-capture","frame-input","progress"].forEach(i=>document.getElementById(i).disabled=false);
  const n=nf();tf.textContent=n-1;pg.max=n-1;
  n2.style.display=(!h2()&&h3())?"block":"none";
  if(h3()){tb.classList.add("show");layout3D();setTimeout(()=>{if(window._r3)window._r3();},50);}
  upF(0);
}

// ===================================================================
// Layout 3D box relative to video
// ===================================================================
function layout3D(){
  if(!h3()) return;
  const vw=vid.videoWidth||0, vh=vid.videoHeight||0;
  // Fallback: compute from video element rendered size
  const w=vw||vid.clientWidth||640, h=vh||vid.clientHeight||480;
  if(w>h){
    // Landscape: stack vertically (3D below)
    va.className="vertical"; grip.style.cursor="row-resize";
  }else{
    // Portrait or square: side by side (3D on right)
    va.className="horizontal"; grip.style.cursor="col-resize";
  }
  vbox.style.flex="1"; tb.style.flex="1";
}

// Split-pane drag
let dragging=false;
grip.addEventListener("mousedown",()=>{dragging=true;document.body.style.cursor=grip.style.cursor;document.body.style.userSelect="none";});
document.addEventListener("mousemove",e=>{
  if(!dragging)return;
  const r=va.getBoundingClientRect();
  if(va.classList.contains("horizontal")){
    const lw=e.clientX-r.left-grip.offsetWidth/2;
    const tw=r.width-grip.offsetWidth;
    vbox.style.flex=Math.max(60,Math.min(tw-60,lw));tb.style.flex=tw-Math.max(60,Math.min(tw-60,lw));
  }else{
    const th=e.clientY-r.top-grip.offsetHeight/2;
    const tw=r.height-grip.offsetHeight;
    vbox.style.flex=Math.max(60,Math.min(tw-60,th));tb.style.flex=tw-Math.max(60,Math.min(tw-60,th));
  }
});
document.addEventListener("mouseup",()=>{
  if(!dragging)return;dragging=false;document.body.style.cursor="";document.body.style.userSelect="";
  setTimeout(()=>{if(window._r3)window._r3();},50);
});

// ===================================================================
// Draw 2D overlay
// ===================================================================
function drawS(i){
  ctx.clearRect(0,0,ov.width,ov.height);
  if(!h2()||!d2.frames[i])return;
  const f=d2.frames[i];
  BONES.forEach(([a,b])=>{
    const k=bk(a,b),c=sel.has(k)?sel.get(k):DC;
    ctx.strokeStyle=c;ctx.lineWidth=sel.has(k)?3:2;ctx.globalAlpha=sel.has(k)?1:0.5;
    ctx.beginPath();ctx.moveTo(f[a][0],f[a][1]);ctx.lineTo(f[b][0],f[b][1]);ctx.stroke();
  });
  f.forEach(p=>{ctx.fillStyle=DC;ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
}

// ===================================================================
// rAF sync (video → skeleton)
// ===================================================================
function rAFSync(){
  if(!anim)return;
  requestAnimationFrame(rAFSync);
  if(!h2()&&!h3())return;
  if(!vid.duration||vid.paused)return;
  const i=Math.round((vid.currentTime/vid.duration)*(nf()-1)),c=Math.max(0,Math.min(i,nf()-1));
  if(c!==lastF){lastF=cur=c;pg.value=c;fi.value=c;drawS(c);upAP();if(h3())up3(c);}
}

// ===================================================================
// Frame control
// ===================================================================
function upF(i){
  if(!h2()&&!h3())return;
  cur=Math.max(0,Math.min(i,nf()-1));pg.value=cur;fi.value=cur;lastF=cur;
  if(vid.duration&&!vid.seeking)vid.currentTime=(cur/(nf()-1))*vid.duration;
  drawS(cur);upAP();if(h3())up3(cur);
}
function step(d){upF(cur+d)}
function togP(){
  if(vid.duration&&vid.readyState>=2){vid.paused?vid.play():vid.pause();}
  else{playing=!playing;document.getElementById("btn-play").textContent=playing?"⏸":"▶";
    if(playing){pt=setInterval(()=>{if(cur>=nf()-1)togP();else upF(cur+1);},1000/30);}else clearInterval(pt);}
}

// ---- Slider: use oninput for real-time ----
pg.oninput=()=>upF(parseInt(pg.value));
fi.onchange=()=>upF(parseInt(fi.value));
document.getElementById("btn-prev").onclick=()=>step(-1);
document.getElementById("btn-play").onclick=()=>togP();
document.getElementById("btn-next").onclick=()=>step(1);

// ---- Long-press step buttons (no onclick conflict) ----
["btn-prev","btn-next"].forEach(bid=>{
  const dir=bid==="btn-prev"?-1:1,btn=document.getElementById(bid);
  let t=null;
  btn.addEventListener("mousedown",e=>{e.preventDefault();step(dir);t=setInterval(()=>step(dir),80);});
  btn.addEventListener("touchstart",e=>{e.preventDefault();step(dir);t=setInterval(()=>step(dir),80);},{passive:false});
  btn.addEventListener("mouseup",()=>{if(t){clearInterval(t);t=null;}});
  btn.addEventListener("mouseleave",()=>{if(t){clearInterval(t);t=null;}});
  btn.addEventListener("touchend",()=>{if(t){clearInterval(t);t=null;}});
  btn.addEventListener("touchcancel",()=>{if(t){clearInterval(t);t=null;}});
});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
  if(e.key==="ArrowRight"){e.preventDefault();step(1);}
  if(e.key===" "){e.preventDefault();togP();}
});

// ===================================================================
// SVG Bone panel
// ===================================================================
function initJP(){
  const svg=document.getElementById("joint-svg");svg.innerHTML="";
  BONES.forEach(([a,b])=>{
    const pa=JL[a],pb=JL[b];
    const h=document.createElementNS("http://www.w3.org/2000/svg","line");
    h.setAttribute("x1",pa.x);h.setAttribute("y1",pa.y);h.setAttribute("x2",pb.x);h.setAttribute("y2",pb.y);
    h.setAttribute("class","bone-hit");h.addEventListener("click",()=>tgB(a,b));svg.appendChild(h);
  });
  BONES.forEach(([a,b])=>{
    const pa=JL[a],pb=JL[b];
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",pa.x);l.setAttribute("y1",pa.y);l.setAttribute("x2",pb.x);l.setAttribute("y2",pb.y);
    l.setAttribute("stroke",DC);l.setAttribute("class","bone-line");l.dataset.a=a;l.dataset.b=b;
    l.addEventListener("click",()=>tgB(a,b));svg.appendChild(l);
  });
  for(let i=0;i<17;i++){const p=JL[i];
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r","5");
    c.setAttribute("fill",DC);c.setAttribute("class","joint-circle");c.innerHTML=`<title>${JN[i]}</title>`;svg.appendChild(c);}
}
function tgB(a,b){
  const k=bk(a,b);
  if(sel.has(k))sel.delete(k);else sel.set(k,PAL[pIdx%PAL.length]),pIdx++;
  document.querySelectorAll("#joint-svg .bone-line").forEach(l=>{
    const k2=bk(parseInt(l.dataset.a),parseInt(l.dataset.b));
    if(sel.has(k2)){l.setAttribute("stroke",sel.get(k2));l.classList.add("selected");}
    else{l.setAttribute("stroke",DC);l.classList.remove("selected");}
  });
  upAP();drawS(cur);if(h3())up3(cur);
}

// ===================================================================
// Angle panel
// ===================================================================
function vA(v1,v2){
  const l1=Math.sqrt(v1[0]**2+v1[1]**2+(v1[2]||0)**2),l2=Math.sqrt(v2[0]**2+v2[1]**2+(v2[2]||0)**2);
  if(l1<1e-9||l2<1e-9)return 0;
  return Math.acos(Math.max(-1,Math.min(1,(v1[0]*v2[0]+v1[1]*v2[1]+(v1[2]||0)*(v2[2]||0))/(l1*l2))))*180/Math.PI;
}
const adj=(()=>{const m=new Map();BONES.forEach(([x,y])=>{(m.has(x)?m.get(x):m.set(x,[]).get(x)).push(y);(m.has(y)?m.get(y):m.set(y,[]).get(y)).push(x);});return m;})();

function upAP(){
  const data=h2()?d2:d3;if(!data||sel.size<2){af.style.display="none";return;}
  const f=data.frames[cur];if(!f){af.style.display="none";return;}
  const entries=[];
  for(let j=0;j<17;j++){
    const nb=(adj.get(j)||[]).filter(n=>sel.has(bk(j,n)));if(nb.length<2)continue;
    for(let i=0;i<nb.length;i++)for(let k=i+1;k<nb.length;k++){
      const ai=nb[i],bi=nb[k],fj=f[j],fa=f[ai],fb=f[bi];
      entries.push({ca:sel.get(bk(j,ai)),cb:sel.get(bk(j,bi)),angle:vA([fa[0]-fj[0],fa[1]-fj[1],fa[2]||0],[fb[0]-fj[0],fb[1]-fj[1],fb[2]||0]),jName:JN[j]});
    }
  }
  if(entries.length===0){af.style.display="none";return;}
  af.style.display="block";al.innerHTML=entries.map(e=>`<div class="angle-entry"><span class="angle-dot" style="background:${e.ca}"></span><span class="angle-dot" style="background:${e.cb}"></span>∠${e.jName}: ${e.angle.toFixed(1)}°</div>`).join("");
}

// ===================================================================
// Rule capture
// ===================================================================
function captureRule(){
  const data=h2()?d2:d3;if(!data)return;const f=data.frames[cur];if(!f)return;
  const parts=[];
  for(let j=0;j<17;j++){
    const nb=(adj.get(j)||[]).filter(n=>sel.has(bk(j,n)));if(nb.length<2)continue;
    for(let i=0;i<nb.length;i++)for(let k=i+1;k<nb.length;k++){
      const ai=nb[i],bi=nb[k],fj=f[j],fa=f[ai],fb=f[bi],m=5;
      parts.push({rule_type:"夹角",p1:JN[ai],p2:JN[j],p3:JN[j],p4:JN[bi],min_value:Math.max(0,Math.round(vA([fa[0]-fj[0],fa[1]-fj[1],fa[2]||0],[fb[0]-fj[0],fb[1]-fj[1],fb[2]||0])-m)),max_value:Math.min(180,Math.round(vA([fa[0]-fj[0],fa[1]-fj[1],fa[2]||0],[fb[0]-fj[0],fb[1]-fj[1],fb[2]||0])+m))});
    }
  }
  if(parts.length===0)return;
  rules.push({rule_no:`R${rules.length+1}`,phase:"all",keypoints_mode:h2()?"2d":"3d",parts,frame:cur,id:Date.now()});
  renderRuleList();
}
function deleteRule(id){rules=rules.filter(r=>r.id!==id);renderRuleList();}
function updateRuleField(id,fld,val){const r=rules.find(r=>r.id===id);if(!r)return;if(fld.startsWith("part_")){const[,i,f]=fld.split("_");r.parts[parseInt(i)][f]=parseFloat(val);}else r[fld]=val;}
function renderRuleList(){
  const el=document.getElementById("rule-list");
  if(rules.length===0){el.innerHTML='<span style="color:#64748b;font-size:11px">选择骨骼 → 定位帧 → 点"录入"</span>';return;}
  el.innerHTML=rules.map(r=>`<div class="rule-entry"><div class="r-header"><span class="r-id">${r.rule_no.slice(0,8)}</span><button onclick="deleteRule(${r.id})" title="删除">✕</button></div><div class="r-row"><label>Phase</label><select onchange="updateRuleField(${r.id},'phase',this.value)">${["all","static_up","static_down","descent","ascent"].map(v=>`<option ${r.phase===v?"selected":""}>${v}</option>`).join("")}</select><label>Mode</label><select onchange="updateRuleField(${r.id},'keypoints_mode',this.value)">${["2d","3d"].map(v=>`<option ${r.keypoints_mode===v?"selected":""}>${v}</option>`).join("")}</select></div>${r.parts.map((p,i)=>`<div class="r-row"><span style="font-size:10px;color:#94a3b8">∠${p.p1}-${p.p2}-${p.p4}</span><input type="number" value="${p.min_value}" style="width:44px" onchange="updateRuleField(${r.id},'part_${i}_min_value',this.value)"><span style="color:#64748b">~</span><input type="number" value="${p.max_value}" style="width:44px" onchange="updateRuleField(${r.id},'part_${i}_max_value',this.value)"><span style="color:#64748b">°</span></div>`).join("")}<div style="font-size:10px;color:#64748b;margin-top:3px">帧 ${r.frame} · ${r.keypoints_mode}</div></div>`).join("");
}
function exportJSON(){
  if(rules.length===0){alert("没有可导出的规则");return;}
  const n=document.getElementById("rule-name").value.trim()||"untitled";
  const blob=new Blob([JSON.stringify({action_no:u4().slice(0,8),action_name:n,rule_set:rules.map(r=>({rule_no:r.rule_no,phase:r.phase==="all"?["all"]:[r.phase],keypoints_mode:r.keypoints_mode,parts:r.parts.map(p=>({rule_type:p.rule_type,p1:p.p1,p2:p.p2,p3:p.p3,p4:p.p4,min_value:p.min_value,max_value:p.max_value}))})),calories_per_rep:0,balance_pairs:[]},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=n+".json";a.click();URL.revokeObjectURL(a.href);
}

// ===================================================================
// Three.js 3D (in video area split-pane)
// ===================================================================
let up3=(_i)=>{};
(function i3D(){
  try{
    const c=document.getElementById("canvas-container");
    const sc=new THREE.Scene();sc.fog=new THREE.Fog(0x0a0a14,3,10);
    const ca=new THREE.PerspectiveCamera(45,c.clientWidth/(c.clientHeight||1),0.1,20);
    ca.position.set(1.5,1.2,2.5);ca.lookAt(0,0.6,0);
    const rn=new THREE.WebGLRenderer({antialias:true,alpha:true});
    rn.setPixelRatio(window.devicePixelRatio);rn.setSize(c.clientWidth,c.clientHeight);c.appendChild(rn.domElement);
    const ct=new THREE.OrbitControls(ca,rn.domElement);ct.target.set(0,0.6,0);ct.enableDamping=true;ct.dampingFactor=0.1;ct.update();
    sc.add(new THREE.AmbientLight(0xffffff,0.8));sc.add(new THREE.DirectionalLight(0xffffff,0.4));
    sc.add(new THREE.GridHelper(3,20,0x333355,0x1a1a2e));
    const jg=new THREE.Group();sc.add(jg);const jm=[];
    for(let i=0;i<17;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.025,12,12),new THREE.MeshBasicMaterial({color:0x60a5fa}));jg.add(m);jm.push(m);}
    const bl=new Map(),lg=new THREE.Group();sc.add(lg);let bi=false;
    up3=(i)=>{
      if(!h3()||!d3.frames[i])return;
      const f=d3.frames[i];
      if(!bi){bi=true;BONES.forEach(([a,b])=>{
        const k=bk(a,b),c=sel.has(k)?new THREE.Color(sel.get(k)):new THREE.Color(DC);
        const mat=new THREE.LineBasicMaterial({color:c,transparent:true,opacity:sel.has(k)?1.0:0.45});
        const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.Float32BufferAttribute(new Float32Array(6),3));
        lg.add(new THREE.Line(geo,mat));bl.set(k,{material:mat,geometry:geo});});}
      f.forEach((p,i)=>{jm[i].position.set(p[0],-p[1],p[2]||0);});
      BONES.forEach(([a,b])=>{
        const k=bk(a,b),e=bl.get(k);if(!e)return;
        const s=f[a],t=f[b],arr=e.geometry.attributes.position.array;
        arr[0]=s[0];arr[1]=-s[1];arr[2]=s[2]||0;arr[3]=t[0];arr[4]=-t[1];arr[5]=t[2]||0;e.geometry.attributes.position.needsUpdate=true;
        e.material.color.set(sel.has(k)?sel.get(k):DC);e.material.opacity=sel.has(k)?1.0:0.45;
      });
    };
    function anim(){requestAnimationFrame(anim);ct.update();rn.render(sc,ca);}anim();
    window._r3=()=>{if(!c.offsetHeight)return;ca.aspect=c.clientWidth/c.clientHeight;ca.updateProjectionMatrix();rn.setSize(c.clientWidth,c.clientHeight);};
    new ResizeObserver(()=>{if(window._r3)window._r3();}).observe(c);
  }catch(e){}
})();
